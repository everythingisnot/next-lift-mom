/* ---------- history editing ----------
   Coaching is never patched by hand after an edit. Every lift's state is rebuilt by replaying the
   whole history oldest first, so what the app recommends always matches what the history shows. */
function exDefById(id){
  for (const d of DAYS) {
    for (const slot of PROGRAM[d].slots) {
      if (!slot.alt && slot.id === id) return resolve(slot, S.rot);
      if (slot.alt && slot.options.some(function(o){ return o.id === id; })) {
        const r = {}; r[slot.alt] = id;
        return resolve(slot, r);
      }
    }
  }
  return null;
}
function sortSessions(){
  S.sessions.sort(function(a,b){
    return String(b.date||"").localeCompare(String(a.date||"")) ||
           String(b.id||"").localeCompare(String(a.id||""));
  });
}
/* One-time replay when the coaching rules change (see COACH_V). History itself is untouched. */
function migrateCoaching(){
  if (prefs().coachV === COACH_V) return;
  try {
    if (S.sessions && S.sessions.length) rebuildLifts();
    S.prefs = Object.assign({}, S.prefs, { coachV: COACH_V });
    cacheLocal();
  } catch(e){ /* leave the old coaching in place rather than break the app */ }
}
function rebuildLifts(){
  const lifts = {};
  const ordered = S.sessions.slice().sort(function(a,b){
    return String(a.date||"").localeCompare(String(b.date||"")) ||
           String(a.id||"").localeCompare(String(b.id||""));
  });
  for (const rec of ordered) {
    for (const en of (rec.entries || [])) {
      if (!en.sets || !en.sets.length) continue;
      const ex = exDefById(en.id);
      if (!ex) continue;
      lifts[en.id] = progress(ex, en, lifts[en.id]);
    }
  }
  S.lifts = lifts;
}
function persistSession(rec){
  cacheLocal();
  try { Promise.resolve(pushState()).catch(function(){}); } catch(e){}
  if (S.db) {
    try { Promise.resolve(S.db.doc("sessions/" + rec.id).set(rec)).catch(function(){}); } catch(e){}
  }
  backupToDrive();
}
function removeSessionDoc(id){
  if (!S.db) return;
  try {
    const ref = S.db.doc("sessions/" + id);
    if (ref && typeof ref.delete === "function") {
      // If the db has no delete, fall back to a tombstone that loading filters out.
      Promise.resolve(ref.delete()).catch(function(){
        try { ref.set({ id:id, deleted:true }); } catch(e){}
      });
    } else {
      ref.set({ id:id, deleted:true });
    }
  } catch(e){}
}

function blankEntry(ex, date){
  return { id:ex.id, name:ex.name, weight:null, band:null, note:"", date:date,
           equip: ex.banded ? null : equipFor(ex),
           hands: ex.banded ? null : handsFor(ex), sets:[] };
}
function openEdit(id){
  const rec = S.sessions.find(function(x){ return x.id === id; });
  if (!rec) return;
  const clone = JSON.parse(JSON.stringify(rec));
  const rot = { squat: clone.squat || S.rot.squat, ham: clone.ham || S.rot.ham };
  const merged = [];
  // Show every exercise for that day, so a lift she forgot to log can still be filled in.
  for (const ex of exercisesFor(clone.day, rot)) {
    const found = (clone.entries || []).find(function(e){ return e.id === ex.id; });
    merged.push(Object.assign(blankEntry(ex, clone.date), found || {}));
  }
  for (const e of (clone.entries || [])) {
    if (!merged.some(function(m){ return m.id === e.id; })) merged.push(e);
  }
  // Give every set its own weight while editing, so an older record (one weight for the whole
  // exercise) can be changed set by set. The entry weight is recomputed from the sets on Save.
  for (const e of merged) {
    for (const s of (e.sets || [])) s.weight = setW(s, e);
    e.weight = null;
  }
  clone.entries = merged;
  S.editRec = clone; S.editId = id; S.armDel = null;
  S.view = "edit"; render();
}
function newPastSession(day){
  if (!PROGRAM[day]) return;
  const rec = { id: "manual-" + Date.now(), date: todayISO(), day: day,
                dayName: PROGRAM[day].name, squat: S.rot.squat, ham: S.rot.ham,
                note: "", entries: [] };
  S.sessions.unshift(rec);
  openEdit(rec.id);
}
function editEntry(exId){
  if (!S.editRec) return null;
  return (S.editRec.entries || []).find(function(e){ return e.id === exId; }) || null;
}
function saveEdit(){
  const rec = S.editRec;
  if (!rec) return;
  // Keep every exercise. One with no sets becomes a skipped entry rather than disappearing.
  rec.entries = (rec.entries || []).map(function(e){
    const done = !!(e.sets && e.sets.length);
    let top = null;
    for (const s of (done ? e.sets : [])) if (s.weight != null && (top == null || s.weight > top)) top = s.weight;
    return Object.assign({}, e, { skipped: !done, sets: done ? e.sets : [], weight: top });
  });
  for (const e of rec.entries) e.date = rec.date;
  if (PROGRAM[rec.day]) rec.dayName = PROGRAM[rec.day].name;
  const i = S.sessions.findIndex(function(x){ return x.id === rec.id; });
  if (i >= 0) S.sessions[i] = rec; else S.sessions.unshift(rec);
  sortSessions();
  rebuildLifts();
  persistSession(rec);
  S.editRec = null; S.editId = null; S.armDel = null;
  S.view = "history"; render();
}
function deleteEditedSession(){
  const rec = S.editRec;
  if (!rec) return;
  S.sessions = S.sessions.filter(function(x){ return x.id !== rec.id; });
  rebuildLifts();
  removeSessionDoc(rec.id);
  cacheLocal();
  backupToDrive();
  try { Promise.resolve(pushState()).catch(function(){}); } catch(e){}
  S.editRec = null; S.editId = null; S.armDel = null;
  S.view = "history"; render();
}

function monthLabel(iso){
  const d = new Date(String(iso).slice(0,10) + "T12:00:00");
  if (isNaN(d)) return "Earlier";
  const sameYear = String(iso).slice(0,4) === todayISO().slice(0,4);
  return d.toLocaleDateString(undefined, sameYear ? { month:"long" } : { month:"long", year:"numeric" });
}
function longDate(iso){
  const d = new Date(String(iso).slice(0,10) + "T12:00:00");
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}


/* Every non-banded exercise in the programme, once each, in rotation order. */
function loadedExercises(){
  const out = [], seen = {};
  for (const d of DAYS) {
    for (const slot of PROGRAM[d].slots) {
      if (slot.banded) continue;
      const opts = slot.alt ? slot.options : [{ id:slot.id, name:slot.name }];
      for (const o of opts) {
        if (seen[o.id]) continue;
        seen[o.id] = 1;
        out.push(Object.assign({}, slot, o, S.settings[o.id] || {}));
      }
    }
  }
  return out;
}

function render(){
  const app = document.getElementById("app");
  let body = "";
  if (S.view === "session" && !S.draft) S.view = "home";
  if (S.view === "session") body = viewSession();
  else if (S.view === "history") body = viewHistory();
  else if (S.view === "edit") body = viewEdit();
  else if (S.view === "settings") body = viewSettings();
  else if (S.view === "done" && S.sessions.length) body = viewDone();
  else { S.view = (S.view === "done") ? "home" : S.view; body = viewHome(); }
  app.innerHTML = topbar() + body;
  renderRest();
  syncClock();
  syncWake();
  renderErrorBar();
}

/* ============================================================
   EVENTS
   ============================================================ */
function stepInput(id, delta, min){
  const el = document.getElementById(id);
  if (!el) return;
  const cur = el.value === "" ? 0 : Number(el.value);
  const v = Math.max(min, Math.round((cur + delta) * 100) / 100);
  el.value = v;
}

/* Rewrites just the sum under the weight box, without re-rendering the card. */
function updateTotal(exId){
  const line = document.getElementById("tot_" + exId);
  if (!line || !S.draft) return;
  const ex = exercisesFor(S.draft.day, draftRot()).find(e => e.id === exId);
  const el = document.getElementById("w_" + exId);
  if (!ex || !el) return;
  line.innerHTML = totalLine(ex, el.value);
}

document.addEventListener("click", function(ev){
  const b = ev.target.closest("[data-act]");
  if (!b || b.tagName === "INPUT" || b.tagName === "TEXTAREA") return;
  const a = b.getAttribute("data-act");
  if (a !== "ditch" && S.armDitch) S.armDitch = false;   // any other tap disarms it
  const exId = b.getAttribute("data-ex");
  const curEx = () => exId && S.draft ? exercisesFor(S.draft.day, draftRot()).find(e => e.id === exId) : null;

  if (a === "errclose") { lastError = null; renderErrorBar(); return; }

  try {
  switch (a) {
    case "home":
      // Back out of History or Settings to wherever they were opened from, so a workout
      // is never lost just because she looked something up mid-session.
      S.view = (S.returnTo === "session" && S.draft) ? "session" : "home";
      S.returnTo = null; S.editId = null; S.armDel = null;
      render(); break;
    case "history":
      S.returnTo = (S.view === "session" && S.draft) ? "session" : "home";
      S.view = "history"; S.editId = null; render(); break;
    case "settings":
      S.returnTo = (S.view === "session" && S.draft) ? "session" : "home";
      S.view = "settings"; render(); break;

    case "start":  startSession(S.rot.day); break;
    case "resume": S.view = "session"; render(); break;
    case "ditch":
      // Two taps instead of confirm(), which a sandboxed frame can block. The first tap arms
      // the button, the second does it.
      if (S.armDitch) { S.armDitch = false; S.draft = null; saveDraft(); render(); }
      else { S.armDitch = true; render(); }
      break;
    case "pick":
      S.rot.day = b.getAttribute("data-day");
      pushState(); render();
      break;

    case "w-": case "w+": {
      const ex = curEx(); if (!ex) break;
      const el = document.getElementById("w_" + exId);
      if (el && loadsFor(ex)) {
        // Step through the weights she owns, not a fixed jump.
        const cur = el.value === "" ? 0 : Number(el.value);
        const v = a === "w+" ? nextLoad(ex, cur) : prevLoad(ex, cur);
        if (v != null) el.value = v;
        else if (a === "w-") el.value = "";
      } else {
        stepInput("w_"+exId, (a === "w+" ? 1 : -1) * weightStep(ex), 0);
      }
      updateTotal(exId);
      break;
    }
    case "r-": stepInput("r_"+exId, -1, 1); break;
    case "r+": stepInput("r_"+exId, 1, 1); break;
    case "log": logSet(exId); break;
    case "addset": {
      if (!S.draft || !S.draft.entries[exId]) break;
      const en = S.draft.entries[exId];
      en.extra = (en.extra || 0) + 1;
      saveDraft(); render();
      break;
    }
    case "warm": {
      if (!S.draft) break;
      const i = Number(b.getAttribute("data-i"));
      S.draft.warm = Object.assign({}, S.draft.warm);
      const row = (S.draft.warm[exId] || []).slice();
      row[i] = !row[i];
      S.draft.warm[exId] = row;
      saveDraft(); render();
      break;
    }
    case "undo": undoSet(exId, Number(b.getAttribute("data-i"))); break;
    case "rpe": setRpe(exId, Number(b.getAttribute("data-i")), Number(b.getAttribute("data-v"))); break;

    case "note":
      S.openNotes[exId] = !S.openNotes[exId];
      render();
      break;

    case "swap": {
      const key = b.getAttribute("data-key"), to = b.getAttribute("data-to");
      if (S.draft) { S.draft[key] = to; saveDraft(); }
      S.rot[key] = to; pushState(); render();
      break;
    }
    case "pref": {
      S.prefs = Object.assign({}, S.prefs);
      S.prefs[b.getAttribute("data-k")] = (b.getAttribute("data-v") === "on");
      if (!prefOn("alarm")) cancelAlarm();
      pushState(); render();
      break;
    }

    case "bar-": case "bar+": {
      const key = b.getAttribute("data-bar");
      const base = barWeight(key);
      S.bars = Object.assign({}, S.bars);
      S.bars[key] = Math.max(0, Math.round((base + (a === "bar+" ? 2.5 : -2.5)) * 100) / 100);
      pushState(); render();
      break;
    }

    case "eqpick": {
      const v = b.getAttribute("data-v");
      if (!EQUIP[v] || !S.draft) break;
      S.settings = Object.assign({}, S.settings);
      S.settings[exId] = Object.assign({}, S.settings[exId] || {}, { equip: v });
      const en = S.draft.entries[exId];
      if (en && !en.sets.length) { en.weight = null; en.blank = true; }
      saveDraft(); pushState(); render();
      break;
    }
    case "ehopen":   openEdit(b.getAttribute("data-id")); break;
    case "ehnew":    newPastSession(b.getAttribute("data-day")); break;
    case "ehsave":   saveEdit(); break;
    case "ehdel":
      if (S.armDel === (S.editRec && S.editRec.id)) deleteEditedSession();
      else { S.armDel = S.editRec && S.editRec.id; render(); }
      break;
    case "ehaddset": {
      const en = editEntry(exId);
      if (!en) break;
      const ex = exDefById(exId);
      const last = en.sets[en.sets.length - 1];
      en.sets.push({ reps: last ? last.reps : (ex ? ex.repLow : 8), rpe: null,
                     weight: last ? (last.weight != null ? last.weight : null) : null });
      render();
      break;
    }
    case "ehdelset": {
      const en = editEntry(exId);
      if (!en) break;
      en.sets.splice(Number(b.getAttribute("data-i")), 1);
      render();
      break;
    }
    case "hnote": {
      const k = b.getAttribute("data-key");
      S.openNotes[k] = !S.openNotes[k];
      render();
      break;
    }
    case "ehnoteopen": {
      const k = "ed_" + exId;
      S.openNotes[k] = !S.openNotes[k];
      render();
      break;
    }

    case "hands": {
      const cur = S.settings[exId] || {};
      S.settings = Object.assign({}, S.settings);
      S.settings[exId] = Object.assign({}, cur, { hands: b.getAttribute("data-v") });
      pushState(); render();
      break;
    }

    case "five": {
      const cur = S.settings[exId] || {};
      S.settings = Object.assign({}, S.settings);
      S.settings[exId] = Object.assign({}, cur, { five: !cur.five });
      pushState(); render();
      break;
    }

    case "finish": finishSession(); break;
    case "backup": backupToDrive(); break;

    case "physio": S.physioOpen = !S.physioOpen; render(); break;
    case "hold": startHold(exId); break;

    case "rest-": bumpRest(-30); break;
    case "rest+": bumpRest(30); break;
    case "rest0": stopRest(); break;

    case "inc-": case "inc+": {
      const cur = S.settings[exId] || {};
      const base = cur.inc != null ? cur.inc : 5;
      S.settings = Object.assign({}, S.settings);
      S.settings[exId] = Object.assign({}, cur, { inc: Math.max(1.25, base + (a==="inc+" ? 2.5 : -2.5)) });
      pushState(); render();
      break;
    }
    case "rest-s": case "rest+s": {
      const cur = S.settings[exId] || {};
      const dflt = defaultRest(exId);
      const base = cur.rest != null ? cur.rest : dflt;
      S.settings = Object.assign({}, S.settings);
      S.settings[exId] = Object.assign({}, cur, { rest: clamp(base + (a==="rest+s" ? 15 : -15), 15, 600) });
      pushState(); render();
      break;
    }
  }
  } catch(e){ showError('Tap "' + a + '"', e); }
});

function defaultRest(id){
  for (const d of DAYS) for (const s of PROGRAM[d].slots) {
    if (s.id === id) return s.rest;
    if (s.alt && s.options.some(o=>o.id===id)) return s.rest;
  }
  return 90;
}

document.addEventListener("input", function(ev){
  const el = ev.target.closest("[data-act]");
  if (el && el.getAttribute("data-act") === "wv") updateTotal(el.getAttribute("data-ex"));
});

document.addEventListener("change", function(ev){
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.getAttribute("data-act"), exId = el.getAttribute("data-ex");
  if (a === "band" && S.draft && S.draft.entries[exId]) {
    S.draft.entries[exId].band = el.value; saveDraft();
  } else if (a === "notetext" && S.draft && S.draft.entries[exId]) {
    S.draft.entries[exId].note = el.value; saveDraft();
  } else if (a === "ehdate") {
    if (S.editRec) S.editRec.date = el.value;
  } else if (a === "ehsw") {
    const en = editEntry(exId);
    const i = Number(el.getAttribute("data-i"));
    const v = el.value === "" ? null : Number(el.value);
    if (en && en.sets[i]) en.sets[i].weight = (v == null || isNaN(v)) ? null : Math.max(0, v);
  } else if (a === "ehband") {
    const en = editEntry(exId);
    if (en) en.band = el.value || null;
  } else if (a === "ehnote") {
    const en = editEntry(exId);
    if (en) en.note = el.value;
  } else if (a === "ehreps") {
    const en = editEntry(exId);
    const i = Number(el.getAttribute("data-i"));
    if (en && en.sets[i]) en.sets[i].reps = Math.max(1, Number(el.value) || 1);
  } else if (a === "ehrpe") {
    const en = editEntry(exId);
    const i = Number(el.getAttribute("data-i"));
    if (en && en.sets[i]) en.sets[i].rpe = el.value === "" ? null : Number(el.value);
  } else if (a === "equip") {
    S.settings = Object.assign({}, S.settings);
    S.settings[exId] = Object.assign({}, S.settings[exId] || {}, { equip: el.value });
    pushState(); render();
  } else if (a === "barv") {
    const key = el.getAttribute("data-bar");
    const v = Math.max(0, Number(el.value) || 0);
    S.bars = Object.assign({}, S.bars); S.bars[key] = v;
    pushState(); render();
  } else if (a === "incv") {
    const v = Math.max(1.25, Number(el.value) || 5);
    S.settings = Object.assign({}, S.settings);
    S.settings[exId] = Object.assign({}, S.settings[exId] || {}, { inc: v });
    pushState();
  } else if (a === "restv") {
    const v = clamp(Number(el.value) || 90, 15, 600);
    S.settings = Object.assign({}, S.settings);
    S.settings[exId] = Object.assign({}, S.settings[exId] || {}, { rest: v });
    pushState();
  }
});

document.addEventListener("keydown", function(ev){
  if (ev.key === "Enter" && ev.target.id && /^[wr]_/.test(ev.target.id)) {
    ev.preventDefault();
    logSet(ev.target.id.slice(2));
  }
});

/* ============================================================
   BOOT
   ============================================================ */
loadLocal();
migrateCoaching();
render();
connect();
// Light up the Drive backup section once the connector capability answers.
// A backup that could not get through last time goes again now.
if (prefs().backupPending) backupToDrive();
</script>
